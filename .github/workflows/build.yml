name: Build

on:
  push:
    tags: ['v*']
    # Branch pushes exercise the pipeline; the release job is tag-only.
    branches: ['**']
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream myMPD tag to build (e.g. v25.0.1)'
        required: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          # platform must match build-images.yml, which publishes
          # odio-mympd-builder:armhf as arm/v7 only — arm/v6 here fails with "no
          # matching manifest". It says nothing about the emitted baseline: the
          # rootfs is Raspberry Pi OS armhf (gcc --with-arch=armv6), hence
          # expect_cpu_arch below, which is what a base-image swap would break.
          - arch: armhf
            platform: linux/arm/v7
            runner: ubuntu-latest
            expect_cpu_arch: v6

    steps:
      # Needs no checkout, and must run before the one below replaces the
      # workspace. Only upstream_tag is used: build.sh sets the package version
      # from myMPD's changelog.
      - name: Resolve upstream tag
        id: upstream
        uses: b0bbywan/odio-ci/actions/resolve-version@v1.0.3
        with:
          upstream_repo: jcorporation/myMPD
          upstream_tag: ${{ github.event.inputs.upstream_tag }}

      - name: Checkout upstream myMPD
        uses: actions/checkout@v7
        with:
          repository: jcorporation/myMPD
          ref: ${{ steps.upstream.outputs.upstream_tag }}
          fetch-depth: 0

      - name: Set up QEMU
        if: matrix.arch == 'armhf'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build .deb
        run: |
          docker run --rm \
            --platform ${{ matrix.platform }} \
            -v "$PWD":/workspace -w /workspace \
            -e DEBIAN_FRONTEND=noninteractive \
            ghcr.io/${{ github.repository_owner }}/odio-mympd-builder:${{ matrix.arch }} \
            bash -c '
              set -e
              ./build.sh installdeps
              ./build.sh pkgdebian
            '

      # build.sh emits mympd_* and mympd-dbgsym_*; the debug symbols are not
      # published. A loop rather than a narrower glob so a future subpackage
      # shows up in the log instead of vanishing silently.
      - name: Collect package
        run: |
          mkdir -p dist
          for f in package/mympd*_${{ matrix.arch }}.deb; do
            case "$(basename "$f")" in
              *-dbgsym_*) echo "skipping $(basename "$f") — debug symbols are not published" ;;
              *)          cp "$f" dist/ ;;
            esac
          done
          ls -lh dist/

      - name: Extract the binary for inspection
        run: dpkg-deb -x dist/mympd_*_${{ matrix.arch }}.deb extract/

      - name: Check binary
        uses: b0bbywan/odio-ci/actions/check-binary@v1.0.3
        with:
          binary: extract/usr/bin/mympd
          arch: ${{ matrix.arch }}
          # bookworm baseline, so the package installs on Pi OS bookworm and
          # trixie. Headroom is thin: the amd64 builder base is debian:trixie.
          glibc_max: '2.36'
          expect_cpu_arch: ${{ matrix.expect_cpu_arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: mympd-${{ matrix.arch }}-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7

  # `needs: build` waits for the whole matrix, so the release is published once
  # with every arch — which immutable releases also require.
  release:
    name: Release and reindex
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: b0bbywan/odio-ci/.github/workflows/release.yml@v1.0.3
    with:
      artifact_pattern: mympd-*-deb
    secrets:
      apt_repo_token: ${{ secrets.APT_REPO_TOKEN }}
