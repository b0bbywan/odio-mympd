name: Build

on:
  push:
    tags: ['v*']
    # Branch pushes exercise the pipeline; the release job is tag-only.
    branches: ['**']
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream myMPD tag to build (e.g. v25.0.1)'
        required: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          # platform must match build-images.yml, which publishes
          # odio-mympd-builder:armhf as arm/v7 only — arm/v6 here fails with "no
          # matching manifest". It says nothing about the emitted baseline: the
          # rootfs is Raspberry Pi OS armhf (gcc --with-arch=armv6), hence
          # expect_cpu_arch below, which is what a base-image swap would break.
          - arch: armhf
            platform: linux/arm/v7
            runner: ubuntu-latest
            expect_cpu_arch: v6

    steps:
      # Needs no checkout, and must run before the one below replaces the
      # workspace. Only upstream_tag is used: build.sh sets the package version
      # from myMPD's changelog.
      - name: Resolve upstream tag
        id: upstream
        uses: b0bbywan/odio-ci/actions/resolve-version@v1.0.3
        with:
          upstream_repo: jcorporation/myMPD
          upstream_tag: ${{ github.event.inputs.upstream_tag }}

      - name: Checkout upstream myMPD
        uses: actions/checkout@v7
        with:
          repository: jcorporation/myMPD
          ref: ${{ steps.upstream.outputs.upstream_tag }}
          fetch-depth: 0

      - name: Set up QEMU
        if: matrix.arch == 'armhf'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build .deb
        run: |
          docker run --rm \
            --platform ${{ matrix.platform }} \
            -v "$PWD":/workspace -w /workspace \
            -e DEBIAN_FRONTEND=noninteractive \
            ghcr.io/${{ github.repository_owner }}/odio-mympd-builder:${{ matrix.arch }} \
            bash -c '
              set -e
              ./build.sh installdeps
              ./build.sh pkgdebian
            '

      # build.sh emits mympd_* and mympd-dbgsym_*; the debug symbols are not
      # published. A loop rather than a narrower glob so a future subpackage
      # shows up in the log instead of vanishing silently.
      - name: Collect package
        run: |
          mkdir -p dist
          for f in package/mympd*_${{ matrix.arch }}.deb; do
            case "$(basename "$f")" in
              *-dbgsym_*) echo "skipping $(basename "$f") — debug symbols are not published" ;;
              *)          cp "$f" dist/ ;;
            esac
          done
          ls -lh dist/

      - name: Extract the binary for inspection
        run: dpkg-deb -x dist/mympd_*_${{ matrix.arch }}.deb extract/

      - name: Check binary
        uses: b0bbywan/odio-ci/actions/check-binary@v1.0.3
        with:
          binary: extract/usr/bin/mympd
          arch: ${{ matrix.arch }}
          # bookworm baseline, so the package installs on Pi OS bookworm and
          # trixie. Headroom is thin: the amd64 builder base is debian:trixie.
          glibc_max: '2.36'
          expect_cpu_arch: ${{ matrix.expect_cpu_arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mympd-${{ matrix.arch }}-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7

  # GPL-3.0 §6(d): the corresponding source ships next to the binaries rather
  # than relying on upstream keeping its tags. myMPD is built unmodified and
  # pkgdebian fetches nothing outside the tree (no submodules, no
  # export-ignore), so `git archive` of the tag is the complete source.
  # Output goes to RUNNER_TEMP: upstream has its own dist/ (vendored libs).
  source:
    name: Source archive
    runs-on: ubuntu-latest
    steps:
      - name: Resolve upstream tag
        id: upstream
        uses: b0bbywan/odio-ci/actions/resolve-version@v1.0.3
        with:
          upstream_repo: jcorporation/myMPD
          upstream_tag: ${{ github.event.inputs.upstream_tag }}

      - name: Checkout upstream myMPD
        uses: actions/checkout@v7
        with:
          repository: jcorporation/myMPD
          ref: ${{ steps.upstream.outputs.upstream_tag }}

      - name: Archive source and write release notes
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          ver="${UPSTREAM_TAG#v}"
          commit="$(git rev-parse HEAD)"
          out="${RUNNER_TEMP}/source"
          mkdir -p "${out}"
          git archive --format=tar.gz --prefix="myMPD-${ver}/" \
            -o "${out}/myMPD-${ver}.tar.gz" HEAD
          cat > "${out}/notes.md" <<EOF
          ## Source

          These packages are built unmodified from myMPD [\`${UPSTREAM_TAG}\`](https://github.com/jcorporation/myMPD/tree/${commit}) (commit \`${commit}\`), licensed GPL-3.0-or-later. The attached \`myMPD-${ver}.tar.gz\` is that tree (\`git archive\`), built with \`./build.sh pkgdebian\`. The build environment is [\`docker/builder.Dockerfile\`](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docker/builder.Dockerfile) and [\`.github/workflows/build.yml\`](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/.github/workflows/build.yml) in this repository.
          EOF
          ls -lh "${out}"

      # Named so it stays out of the release's mympd-*-deb pattern.
      - name: Upload source
        uses: actions/upload-artifact@v7
        with:
          name: mympd-source
          path: ${{ runner.temp }}/source/
          if-no-files-found: error
          retention-days: 7

  # `needs: build` waits for the whole matrix, so the release is published once
  # with every arch — which immutable releases also require.
  release:
    name: Release and reindex
    needs: [build, source]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: b0bbywan/odio-ci/.github/workflows/release.yml@v1.0.3
    with:
      artifact_pattern: mympd-*-deb
    secrets:
      apt_repo_token: ${{ secrets.APT_REPO_TOKEN }}

  # The reusable release only attaches .debs. Uploading afterwards rules out
  # immutable releases for this repo, as in odio-upmpdcli.
  attach-source:
    name: Attach source
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download source
        uses: actions/download-artifact@v8
        with:
          name: mympd-source
          path: dist

      # Appends to the generated notes; skipped on a rerun so the section is
      # not duplicated.
      - name: Attach source and add it to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz --clobber
          body="$(gh release view "${GITHUB_REF_NAME}" --json body --jq .body)"
          if ! grep -q '^## Source$' <<<"${body}"; then
            printf '%s\n\n%s\n' "${body}" "$(cat dist/notes.md)" > body.md
            gh release edit "${GITHUB_REF_NAME}" --notes-file body.md
          fi
